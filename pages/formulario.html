<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="../src/images/favicon.svg"><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/css/style.css">
</head>
<body>
     <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <a class="logo" href="../index.html">Um Lar</a>
      <nav aria-label="Navegação principal">
        <a href="../index.html">Início</a>
        <a href="animais.html">Animais</a>
        <a href="adocao.html">Como adotar</a>
        <a href="cuidados.html">Cuidados</a>
      </nav>
      <a class="botao botao-pequeno" href="formulario.html">Quero adotar</a>
    </div>
  </header>
  <main>
    <section class="formulario">
        <div class="container">
            <h2>Formulário de adoção</h2>
            <p>Preencha os dados abaixo e entraremos em contato:</p>

            <form id="form-adocao" onsubmit="enviar(event)">
                    <p> Animal escolhido: 
                        <input type="text" id="campoAnimal" name="animal_escolhido" readonly> </p>
                    <p> 
                        <input type="email" placeholder="Email*" id="campoEmail" name="email" size="50" required> </p> 
                    <p> 
                        <input type="tel" placeholder="Telefone/Whatsapp*" id="campoTelefone" name="telefone" required> </p>

                    <p> Moradia: 
                        <input type="radio" id="moradia_casa" name="tipo_moradia" value="Casa" required> 
                        <label for="moradia_casa">Casa</label>
                        <input type="radio" id="moradia_apartamento" name="tipo_moradia" value="Apartamento" required>
                        <label for="moradia_apartamento">Apartamento</label> </p>

                    <h3> Endereço: </h3>
                    <p> 
                        <input type="text" id="cep" name="cep" placeholder="Cep*" maxlength="9" required> 
                        <input type="text" id="rua" name="rua" placeholder="Rua*" required>  
                        <input type="text" id="numero" name="numero" placeholder="Número*" required> 
                        <input type="text" id="complemento" name="complemento" placeholder="Complemento"> 
                    </p>
                <p> <input type="text" id="bairro" placeholder="Bairro*" required>
                    <input type="text" id="cidade" placeholder="Cidade*" required>
                    <select id="estado" name="Estado" required>
                        <option value="">Selecione o estado...</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                        
                    </select> </p>    

                <p>Por que você quer adotar este animal?<textarea rows="5" cols="50"></textarea></p>
                <p> <input type="submit" class="botao-pequeno" value="Enviar credenciais" onclick="enviar()"> </p>



                <script>
                    const parametros = new URLSearchParams(window.location.search);
                    const animalEscolhido = parametros.get('animal');
                    const meuCampo = document.getElementById('campoAnimal');

                    if (animalEscolhido != null){

                        meuCampo.value = animalEscolhido;
                    }

                        const campoCep = document.getElementById('cep');
                        const campoRua = document.getElementById('rua');
                        const campoBairro = document.getElementById('bairro');
                        const campoCidade = document.getElementById('cidade');
                        const campoEstado = document.getElementById('estado');

                        campoCep.addEventListener('focusout', function() {
                            const cepDigitado = campoCep.value;

                            if(cepDigitado === "") {
                                campoRua.value = "";
                                campoBairro.value = "";
                                campoCidade.value = "";
                                campoEstado.value = "";

                            } else {
                            const linkDaApi = 'https://viacep.com.br/ws/' + cepDigitado + '/json/';
                            fetch(linkDaApi)
                            .then(function(resposta){
                                return resposta.json();
                            })
                            .then(function(dados) {
                                campoRua.value = dados.logradouro;
                                campoBairro.value = dados.bairro;
                                campoCidade.value = dados.localidade;
                                campoEstado.value = dados.uf;

                            });
                          }
                        });

                        function enviar(event) {
                            event.preventDefault();
                            alert("Formulário enviado com sucesso! A equipe de Um lar entrará em contato em breve.");
                            document.getElementById('form-adocao').reset();
                        }


                </script>

            </form>
        </div>
        
    </section>


  </main>






   <footer class="rodape">
    <div class="container rodape-conteudo">
      <a class="logo logo-claro" href="../index.html">Um Lar</a>
      <p>Projeto acadêmico sobre adoção responsável de animais.</p>
      <span>© 2026 Um Lar</span>
    </div>
  </footer>

</body>
</html>
